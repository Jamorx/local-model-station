name: Bug report
description: Report a reproducible macOS gateway issue
title: "[Bug] "
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS version, chip, memory, Python, profile and engine versions. No keys or private paths.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and expected behavior
      description: Minimal request with personal prompts and credentials removed.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Actual behavior and sanitized logs
