[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-model-gateway"
version = "0.1.0"
description = "A macOS local model gateway with durable jobs and configurable engine adapters"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dynamic = ["dependencies"]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: MacOS", "Programming Language :: Python :: 3.12"]

[project.scripts]
lmg = "model_gateway.__main__:main"

[tool.setuptools]
packages = ["model_gateway", "model_gateway.moss_edit_deps"]
include-package-data = true

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-api.txt"]}

[tool.setuptools.package-data]
model_gateway = ["*.html", "*.css", "*.js", "*.json", "*.sh", "assets/*", "assets/tabulator/*", "assets/bootstrap/*"]

"model_gateway.moss_edit_deps" = ["LICENSE.OpenMOSS.txt"]
